<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Starter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a1d24;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #3b82f6;
      --danger: #ef4444;
      --ok: #10b981;
      --warn: #f59e0b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #181b21;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #2a2f37;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "微软雅黑", Roboto, sans-serif;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }
    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center;
    }
    header h1 { margin: 0; font-size: 16px; flex: 0 0 auto; }
    .tabs { display: flex; gap: 4px; flex: 1; margin-left: 12px; }
    .tab {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }
    .tab.active { background: var(--card); color: var(--text); border-color: var(--border); }
    .tab:hover { color: var(--text); }
    button {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }
    button.primary { background: var(--primary); color: white; border-color: var(--primary); }
    button.danger { background: var(--danger); color: white; border-color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .search { flex: 0 0 240px; }
    .search input {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .lang-select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    main { padding: 16px; }
    .page { display: none; }
    .page.active { display: block; }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    th { font-size: 12px; color: var(--muted); font-weight: 500; }
    tr:hover td { background: var(--card); }
    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 11px; font-weight: 500;
    }
    .badge.on { background: rgba(16,185,129,0.15); color: var(--ok); }
    .badge.off { background: rgba(107,114,128,0.15); color: var(--muted); }
    .badge.critical { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge.normal { background: rgba(59,130,246,0.15); color: var(--primary); }
    .badge.recommend { background: rgba(245,158,11,0.15); color: var(--warn); }
    input[type=number] {
      width: 90px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .row-actions { display: flex; gap: 4px; }
    .empty { text-align: center; color: var(--muted); padding: 40px; }
    .toast {
      position: fixed; bottom: 16px; right: 16px;
      padding: 8px 14px; border-radius: 6px;
      background: var(--text); color: var(--bg);
      font-size: 13px; opacity: 0; transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
    #timeline-svg { width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--card); }
    #timeline-list { list-style: none; padding: 0; margin: 12px 0 0; max-height: 200px; overflow-y: auto; font-size: 12px; }
    #timeline-list li { padding: 4px 0; border-bottom: 1px solid var(--border); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
    .card code { font-size: 12px; word-break: break-all; }
    /* ===== 无边框自定义标题栏 ===== */
    html, body { height: 100%; background: transparent; }
    body { overflow: hidden; }
    #app {
      height: 100vh;
      display: flex; flex-direction: column;
      background: transparent;
    }
    .titlebar {
      height: 36px;
      flex: 0 0 36px;
      display: flex; align-items: center;
      background: transparent;
      user-select: none; -webkit-user-select: none;
      border-bottom: 1px solid var(--border);
    }
    .titlebar .title {
      padding: 0 12px;
      font-size: 13px; font-weight: 600; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .titlebar .spacer { flex: 1; }
    .titlebar .win-controls {
      display: flex; align-items: center; height: 100%;
    }
    .win-btn {
      width: 44px; height: 100%;
      border: none; background: transparent; color: var(--text);
      font-size: 12px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 0;
    }
    .win-btn:hover { background: rgba(128,128,128,0.18); }
    .win-btn.close:hover { background: #e81123; color: #fff; }
    .win-btn svg { width: 10px; height: 10px; fill: currentColor; }
    main { flex: 1; overflow-y: auto; padding: 16px; }
    /* 内容区背景半透明，让 Mica 透出 */
    .page.active { background: transparent; }
  </style>
</head>
<body>
  <div id="app">
  <div class="titlebar" id="titlebar" data-tauri-drag-region>
    <div class="title" data-i18n="app.title">Starter</div>
    <div class="spacer"></div>
    <div class="win-controls">
      <button class="win-btn" id="win-min" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1"/></svg>
      </button>
      <button class="win-btn" id="win-max" title="Maximize" aria-label="Maximize">
        <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="win-btn close" id="win-close" title="Close" aria-label="Close">
        <svg viewBox="0 0 10 10"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>
  <header>
    <div class="tabs">
      <button class="tab active" data-tab="items" data-i18n="tabs.items">启动项</button>
      <button class="tab" data-tab="timeline" data-i18n="tabs.timeline">时间线</button>
      <button class="tab" data-tab="settings" data-i18n="tabs.settings">设置</button>
    </div>
    <div class="search"><input id="search" data-i18n-attr="placeholder:search.placeholder" /></div>
    <select id="lang-select" class="lang-select" title="Language">
      <option value="zh-CN">简体中文</option>
      <option value="en">English</option>
    </select>
    <button id="btn-scan" class="primary" data-i18n="buttons.rescan">重新扫描</button>
  </header>
  <main>
    <div id="preview-banner" style="display:none;background:var(--warn);color:#000;padding:8px 12px;font-size:12px;border-radius:6px;margin-bottom:12px;" data-i18n="app.preview">
      浏览器预览模式（mock 数据，无 Tauri 运行时）。启动 starter-ui.exe 看真实效果。
    </div>
    <div class="page active" data-page="items">
      <div class="meta" id="meta" data-i18n="items.loading">加载中...</div>
      <table>
        <thead>
          <tr>
            <th data-i18n="items.columns.name">名称</th>
            <th data-i18n="items.columns.source">来源</th>
            <th data-i18n="items.columns.risk">风险</th>
            <th data-i18n="items.columns.state">状态</th>
            <th data-i18n="items.columns.delay">延迟 (ms)</th>
            <th data-i18n="items.columns.priority">优先级</th>
            <th data-i18n="items.columns.actions">操作</th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none" data-i18n="items.empty">暂无启动项。</div>
    </div>

    <div class="page" data-page="timeline">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
        <h2 style="margin:0;font-size:14px;flex:1" data-i18n="timeline.title">上次启动时间线</h2>
        <button id="btn-refresh-timeline" data-i18n="buttons.refresh">刷新</button>
      </div>
      <svg id="timeline-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <ul id="timeline-list"></ul>
    </div>

    <div class="page" data-page="settings">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
        <h2 style="margin:0;font-size:14px;flex:1" data-i18n="settings.title">设置与诊断</h2>
        <button id="btn-refresh-settings" data-i18n="buttons.refresh">刷新</button>
      </div>
      <div class="card">
        <h3 data-i18n="settings.diskIo">磁盘 IO</h3>
        <code id="io-status">—</code>
      </div>
      <div class="card">
        <h3 data-i18n="settings.windowsService">Windows 服务</h3>
        <code id="service-status">—</code>
      </div>
      <div class="card">
        <h3 data-i18n="settings.doctor">自检</h3>
        <code id="doctor-status">—</code>
      </div>
      <div class="card">
        <h3 data-i18n="settings.quickActions">快捷操作</h3>
        <button id="btn-dry-run" data-i18n="buttons.dryRun">跑一次干调度（模拟）</button>
        <p style="font-size:12px;color:var(--muted);margin:8px 0 0" data-i18n="settings.dryRunHelp">跑一次模拟调度，用来填充时间线。</p>
      </div>
    </div>
  </main>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
